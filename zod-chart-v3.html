<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOD/USDT · چارت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(98.9% 0.003 255);
  --surface: oklch(96.8% 0.005 255);
  --line: oklch(92.5% 0.006 255);
  --line-strong: oklch(87% 0.008 255);
  --text: oklch(24% 0.016 255);
  --muted: oklch(53% 0.016 255);
  --tool: oklch(38% 0.016 255);
  --accent: oklch(50% 0.19 264);
  --accent-soft: oklch(94.5% 0.035 264);
  --up: oklch(62% 0.12 172);
  --up-soft: oklch(90% 0.05 172);
  --up-ink: oklch(42% 0.1 172);
  --down: oklch(60% 0.19 23);
  --down-soft: oklch(91% 0.045 23);
  --down-ink: oklch(45% 0.16 23);
  --ema: oklch(55% 0.19 300);
  --shadow: oklch(30% 0.03 255 / .28);
  --ease: cubic-bezier(0.22,1,0.36,1);
  --z-panel: 20; --z-edit: 25; --z-tip: 50; --z-pop: 40;
}
[data-theme="dark"]{
  --bg: oklch(18.5% 0.012 262);
  --surface: oklch(23% 0.014 262);
  --line: oklch(26.5% 0.014 262);
  --line-strong: oklch(33% 0.016 262);
  --text: oklch(91% 0.008 262);
  --muted: oklch(66% 0.014 262);
  --tool: oklch(80% 0.01 262);
  --accent: oklch(70% 0.15 264);
  --accent-soft: oklch(30% 0.07 264);
  --up: oklch(70% 0.12 172);
  --up-soft: oklch(31% 0.05 172);
  --up-ink: oklch(78% 0.11 172);
  --down: oklch(66% 0.18 23);
  --down-soft: oklch(31% 0.06 23);
  --down-ink: oklch(78% 0.13 23);
  --ema: oklch(72% 0.15 300);
  --shadow: oklch(8% 0.01 262 / .6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;font-size:14px;overflow:hidden;transition:background .25s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:52px 1fr 32px;grid-template-columns:52px 1fr;height:100vh;height:100dvh;direction:ltr}

header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:1px solid var(--line);min-width:0}
.sym{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em}
.sym b{font-size:15px;font-weight:700;letter-spacing:.01em}
.sym small{color:var(--muted);font-size:12px}
.vsep{width:1px;height:22px;background:var(--line)}
.tfs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.hbtn,.tfs button{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbtn:hover,.tfs button:hover{background:var(--surface);color:var(--text)}
.tfs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ind{display:flex;align-items:center;gap:6px}
.ind .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .15s var(--ease)}
.ind[aria-pressed="true"]{color:var(--text)}
.ind[aria-pressed="true"] .dot{background:var(--ema)}
.theme{width:34px;height:34px;padding:0;display:grid;place-items:center;color:var(--tool)}
.theme svg{width:18px;height:18px}
.i-moon,.i-sun{place-items:center}
.i-moon{display:grid}.i-sun{display:none}
[data-theme="dark"] .i-sun{display:grid} [data-theme="dark"] .i-moon{display:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quote{margin-left:auto;display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quote .px{font-size:19px;font-weight:700;transition:color .3s var(--ease)}
.quote .chg{font-size:13px;font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}

.toolbar{grid-row:2/4;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.sep{width:24px;height:1px;background:var(--line);margin:6px 0;flex:none}
.tool{position:relative;flex:none;width:40px;height:40px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--tool);transition:background .15s var(--ease),color .15s var(--ease)}
.tool:hover{background:var(--surface)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:22px;height:22px}
.tip{position:fixed;left:0;top:0;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap;direction:rtl;pointer-events:none;z-index:var(--z-tip);opacity:0;transition:opacity .15s var(--ease)}
.tip.on{opacity:1}

.chart{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.legend{position:absolute;left:12px;top:10px;pointer-events:none;font-size:12.5px;line-height:1.6;font-variant-numeric:tabular-nums;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.legend .l1{color:var(--text);font-weight:600;font-size:13.5px}
.legend .l1 span{color:var(--muted);font-weight:400}
.legend .l2 i,.legend .l3 i{font-style:normal;color:var(--muted);margin-right:3px}
.legend .l2 em{font-style:normal;margin-right:10px}
.legend .l3{color:var(--ema)}
.legend .l3 em{font-style:normal}

.txt-edit{position:absolute;z-index:var(--z-edit);min-width:160px;padding:3px 6px;border:1.5px solid var(--accent);border-radius:5px;background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);outline:none;resize:none;overflow:hidden;line-height:1.35}

/* floating drawing toolbar */
.ftb{position:absolute;z-index:var(--z-panel);display:flex;align-items:center;gap:1px;padding:3px;background:var(--bg);border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 8px 24px -10px var(--shadow);direction:ltr;animation:pin .22s var(--ease)}
.ftb[hidden]{display:none}
.fb{position:relative;flex:none;width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--tool);transition:background .12s var(--ease),color .12s var(--ease)}
.fb:hover{background:var(--surface)}
.fb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.fb svg{width:18px;height:18px}
.fb .bar{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px}
.fb.has-bar svg{transform:translateY(-2px)}
.fb.wide{width:auto;padding:0 8px;display:flex;gap:6px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.fb.wide svg{width:20px}
.fb.grip{width:16px;cursor:grab;color:var(--muted)}
.fb.grip:active{cursor:grabbing}
.fb.danger:hover{background:var(--down-soft);color:var(--down)}
.fsep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}

/* popover */
.pop{position:fixed;left:0;top:0;z-index:var(--z-pop);background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 32px -12px var(--shadow);padding:10px;direction:rtl;animation:pin .18s var(--ease)}
.pop[hidden]{display:none}
.pal{display:grid;grid-template-columns:repeat(9,20px);gap:4px;direction:ltr}
.pal button{width:20px;height:20px;padding:0;border-radius:4px;border:1px solid oklch(40% 0.02 255 / .15);cursor:pointer;transition:transform .12s var(--ease)}
.pal button:hover{transform:scale(1.15)}
.pal button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.pal .gap{grid-column:1/-1;height:2px}
.pop-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pop-row input[type=range]{flex:1;accent-color:var(--accent)}
.pop-row output{min-width:34px;text-align:left;font-variant-numeric:tabular-nums;color:var(--text)}
.pop-auto{margin-top:10px;width:100%;border:1px solid var(--line-strong);background:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px}
.pop-auto[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.plist{display:flex;flex-direction:column;min-width:128px}
.plist button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;direction:ltr;font-variant-numeric:tabular-nums}
.plist button:hover{background:var(--surface)}
.plist button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.plist svg{width:44px;height:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);cursor:pointer}
.chk input,.f-check input,.f-row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* settings panel */
.panel{position:absolute;top:12px;right:88px;width:304px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px -12px var(--shadow);direction:rtl;z-index:var(--z-panel);animation:pin .28s var(--ease)}
.panel[hidden]{display:none}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.p-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.p-head b{font-size:14px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:500}
.chip.long{background:var(--up-soft);color:var(--up-ink)}
.chip.short{background:var(--down-soft);color:var(--down-ink)}
.chip[hidden]{display:none}
.p-head .x{margin-right:auto;border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.p-head .x:hover{background:var(--surface);color:var(--text)}
.p-tabs{display:flex;gap:16px;padding:0 14px;border-bottom:1px solid var(--line)}
.p-tabs button{border:0;background:none;padding:8px 0;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:color .15s var(--ease),border-color .15s var(--ease)}
.p-tabs button:hover{color:var(--text)}
.p-tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.p-body{padding:6px 14px 10px;overflow-y:auto;flex:1}
.f-row{display:flex;align-items:center;gap:12px;min-height:40px}
.f-lab{flex:1;font-size:13px}
.f-col{flex-direction:column;align-items:stretch;gap:6px;padding:8px 0}
.f-ctrl{display:flex;align-items:center;gap:6px;direction:ltr}
.f-row input[type=number],.f-row input[type=datetime-local],.f-row select{width:148px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);font-size:13px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;transition:border-color .15s var(--ease)}
.f-row select{direction:rtl;text-align:right;cursor:pointer}
.f-row textarea{width:100%;min-height:64px;padding:8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);font-size:13px;resize:vertical}
.f-row input:focus,.f-row textarea:focus,.f-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f-row input[aria-invalid="true"]{border-color:var(--down);box-shadow:0 0 0 3px var(--down-soft)}
.f-check{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;font-size:13px}
.f-info{flex:none;direction:ltr;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px}
.sw{width:30px;height:30px;padding:3px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);cursor:pointer;flex:none}
.sw i{display:block;width:100%;height:100%;border-radius:3px}
.sw:hover{border-color:var(--muted)}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{width:30px;height:28px;border:0;background:none;cursor:pointer;color:var(--tool);display:grid;place-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg svg{width:20px;height:12px}
.p-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.p-foot button{border:1px solid var(--line-strong);background:var(--bg);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;transition:background .15s var(--ease)}
.p-foot button:hover{background:var(--surface)}
.p-foot .primary{margin-right:auto;background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.p-foot .primary:hover{background:var(--accent);filter:brightness(1.08)}
.p-foot .done{color:var(--up)}

footer{display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
.hint{direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;order:2}
.fbtns{display:flex;gap:2px;order:1}
.fbtn{border:0;background:none;height:24px;min-width:26px;padding:0 6px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.fbtn:hover{background:var(--surface);color:var(--text)}
.fbtn[aria-pressed="true"]{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;order:0}

@media (max-width:760px){
  header{gap:8px;padding:0 8px}
  .sym small,.quote .chg,.vsep{display:none}
  .app{grid-template-columns:44px 1fr}
  .tool{width:36px;height:36px}
  .tip{display:none}
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:62%}
  .clock{display:none}
  .fb{width:30px;height:30px}
}
</style>

<div class="app">
  <header>
    <div class="sym"><div class="mark">Zo</div><b>ZOD/USDT</b><small>Zo Exchange · داده آزمایشی</small></div>
    <nav class="tfs" id="tfs" aria-label="تایم‌فریم"></nav>
    <div class="vsep"></div>
    <button class="hbtn ind" id="emaBtn" aria-pressed="true"><span class="dot"></span>EMA 20</button>
    <div class="quote"><span class="px" id="qPx">0</span><span class="chg" id="qChg"></span></div>
    <button class="hbtn theme" id="themeBtn" aria-label="تم شب / روز"><span class="i-moon"><i data-lucide="moon"></i></span><span class="i-sun"><i data-lucide="sun"></i></span></button>
  </header>

  <aside class="toolbar" id="toolbar" aria-label="ابزارها">
    <button class="tool" data-tool="cursor" data-tip="نشانگر (V)" aria-pressed="true"><i data-lucide="mouse-pointer-2"></i></button>
    <button class="tool" data-tool="cross" data-tip="کراس‌هیر (C)"><i data-lucide="crosshair"></i></button>
    <div class="sep"></div>
    <button class="tool" data-tool="trend" data-tip="خط روند (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5.5 18.5 18.5 5.5"/><circle cx="4.5" cy="19.5" r="2"/><circle cx="19.5" cy="4.5" r="2"/></svg></button>
    <button class="tool" data-tool="hline" data-tip="خط افقی (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12h7m5 0h7"/><circle cx="12" cy="12" r="2.2"/></svg></button>
    <button class="tool" data-tool="rect" data-tip="مستطیل (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="6" width="14" height="12" rx="0.5"/><rect x="3" y="4" width="4" height="4" rx="1" fill="var(--bg)"/><rect x="17" y="16" width="4" height="4" rx="1" fill="var(--bg)"/></svg></button>
    <button class="tool" data-tool="text" data-tip="متن (X)"><i data-lucide="type"></i></button>
    <div class="sep"></div>
    <button class="tool" data-tool="long" data-tip="پوزیشن لانگ (L)">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3" width="17" height="10" rx="1.5" fill="var(--up-soft)" stroke="var(--up)" stroke-width="1.4"/><rect x="3.5" y="13" width="17" height="7.5" rx="1.5" fill="var(--down-soft)" stroke="var(--down)" stroke-width="1.4"/><path d="M3.5 13h17" stroke="currentColor" stroke-width="1.6"/><path d="M12 10.5V6m-2.2 2.2L12 6l2.2 2.2" fill="none" stroke="var(--up)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tool" data-tool="short" data-tip="پوزیشن شورت (S)">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="7.5" rx="1.5" fill="var(--down-soft)" stroke="var(--down)" stroke-width="1.4"/><rect x="3.5" y="11" width="17" height="10" rx="1.5" fill="var(--up-soft)" stroke="var(--up)" stroke-width="1.4"/><path d="M3.5 11h17" stroke="currentColor" stroke-width="1.6"/><path d="M12 13.5V18m-2.2-2.2L12 18l2.2-2.2" fill="none" stroke="var(--up)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="sep"></div>
    <button class="tool" data-tool="measure" data-tip="خط‌کش (U یا Shift + کشیدن)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M2.8 16.2 16.2 2.8l5 5L7.8 21.2z"/><path d="M6.5 12.5 8.6 14.6M9.5 9.5l1.4 1.4M12.5 6.5l2.1 2.1M15.5 3.5l1.4 1.4"/></svg></button>
    <button class="tool" id="magnet" data-tip="آهنربا: چسبیدن به OHLC (M)"><i data-lucide="magnet"></i></button>
    <button class="tool" id="undo" data-tip="برگشت (Ctrl+Z)"><i data-lucide="undo-2"></i></button>

  </aside>

  <main class="chart" id="chartWrap">

    <div class="legend" id="legend"></div>

<script>
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const cv = $('#cv'), ctx = cv.getContext('2d'), wrap = $('#chartWrap');
const AR = 78, AB = 28;
let W = 0, H = 0, DPR = 1;

/* ---------- color helpers ---------- */
const hexRgb = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };

const BASES = ['#e0474c','#f08c2e','#e8c547','#5bb75a','#1a9c86','#2bb3c0','#3d5ce0','#8a45d6','#d6458f'];
const GRAYS = ['#fbfbfc','#e6e8ec','#c9cdd4','#a6acb7','#838a96','#626874','#454a54','#2b2f37','#16181d'];
const PALETTE = [GRAYS, ...[['#fbfbfc',0.72],['#fbfbfc',0.45],[null,0],['#101216',0.28],['#101216',0.5]].map(([t,k]) => BASES.map(b => t ? mix(b,t,k) : b))];

const THEMES = {
  light:{ bg:'#fbfbfc', grid:'#eff1f4', border:'#e2e5ea', text:'#687080', textStrong:'#20242d',
    up:'#1a9c86', down:'#e0474c', upVol:'rgba(26,156,134,0.22)', downVol:'rgba(224,71,76,0.2)',
    accent:'#3553d4', sel:'rgba(53,83,212,0.12)', cross:'#9aa1ad', tagDark:'#262b35', on:'#fcfdfd',
    entry:'#6f7683', pending:'#7b8290', ema:'#8a45d6', soft:0.13, strong:0.30 },
  dark:{ bg:'#13161d', grid:'#1c2029', border:'#2a2f3a', text:'#8b92a1', textStrong:'#dfe3ea',
    up:'#2fb39b', down:'#f0585c', upVol:'rgba(47,179,155,0.25)', downVol:'rgba(240,88,92,0.24)',
    accent:'#7c93ff', sel:'rgba(124,147,255,0.16)', cross:'#5d6574', tagDark:'#3b4250', on:'#f4f6f9',
    entry:'#9aa1ae', pending:'#5e6573', ema:'#b58cf5', soft:0.15, strong:0.33 }
};
let theme = 'light';
try { theme = localStorage.getItem('zo-chart-theme') || 'light'; } catch(e){}
let C = THEMES[theme];
document.documentElement.dataset.theme = theme;
const F_AX = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
const F_FA = '500 12px Vazirmatn, system-ui, sans-serif';
const LRI = s => '\u2066' + s + '\u2069';
const RTL_RE = /[\u0590-\u08FF\uFB1D-\uFEFC]/;
const colorOf = c => c || C.textStrong;

/* ---------- drawing defaults (templates) ---------- */
const SIZES = [10,11,12,14,16,20,24,28,32,40];
const BASE_DEF = {
  trend:{color:'#3d5ce0', width:2, style:'solid', extL:false, extR:false, stats:false, text:'', textSize:13},
  rect:{color:'#3d5ce0', width:1, style:'solid', fill:'#3d5ce0', fillA:0.12, fillOn:true, extL:false, extR:false, mid:false, text:'', textColor:null, textSize:13, vAlign:'middle'},
  text:{color:null, size:16, bold:false, italic:false, bgOn:false, bg:'#3d5ce0', bgA:0.15, borderOn:false, border:'#3d5ce0'},
  hline:{color:'#c77d12', width:1, style:'solid', label:true, text:''},
  long:{account:10000, riskMode:'%', risk:1, tpColor:'#1a9c86', slColor:'#e0474c', always:false, compact:false},
  short:{account:10000, riskMode:'%', risk:1, tpColor:'#1a9c86', slColor:'#e0474c', always:false, compact:false}
};
let DEF = JSON.parse(JSON.stringify(BASE_DEF));
try { const s = JSON.parse(localStorage.getItem('zo-chart-defs') || '{}'); for(const k in s) DEF[k] = Object.assign(DEF[k], s[k]); } catch(e){}

/* ---------- data ---------- */
const TFS = {'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1D':86400};
let tf = '15m', tfSec = 900, bars = [];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gen(n){
  const r = mulberry(tfSec*7+13);
  const sig = 0.0036*Math.sqrt(tfSec/900);
  const end = Math.floor(Date.now()/1000/tfSec)*tfSec;
  const closes = new Array(n); let p = 1842.35, drift = 0, regime = 0;
  for(let k=n-1;k>=0;k--){
    closes[k] = p;
    if(regime-- <= 0){ drift = (r()-0.5)*sig*0.7; regime = 25 + (r()*90|0); }
    p = p / Math.exp(drift + sig*(0.55+r()*0.9)*gauss(r));
  }
  bars = [];
  for(let k=0;k<n;k++){
    const c = closes[k], o = k ? closes[k-1] : c*(1 - sig*0.4*gauss(r));
    const span = Math.abs(c-o) + c*sig*0.3;
    const h = Math.max(o,c) + r()*span*0.75, l = Math.min(o,c) - r()*span*0.75;
    const v = (700 + r()*1500) * (1 + Math.abs(c-o)/c/sig*1.1) * Math.sqrt(tfSec/900);
    bars.push({t:end-(n-1-k)*tfSec,o,h,l,c,v});
  }
}
const I = t => (t - bars[0].t)/tfSec;
const T = i => bars[0].t + Math.round(i)*tfSec;

let showEma = true, ema = [];
const EMA_LEN = 20;
function calcEma(){
  const n = bars.length, k = 2/(EMA_LEN+1);
  ema = new Array(n).fill(null);
  if(n < EMA_LEN) return;
  let s = 0; for(let i=0;i<EMA_LEN;i++) s += bars[i].c;
  ema[EMA_LEN-1] = s/EMA_LEN;
  for(let i=EMA_LEN;i<n;i++) ema[i] = bars[i].c*k + ema[i-1]*(1-k);
}

/* ---------- view ---------- */
const view = {barW:8, right:0, auto:true, pMin:0, pMax:1};
const pw = () => W - AR, ph = () => H - AB;
const xOf = i => pw() - (view.right - i)*view.barW;
const iOf = x => view.right - (pw() - x)/view.barW;
const yOf = p => (view.pMax - p)/(view.pMax - view.pMin)*ph();
const pOf = y => view.pMax - y/ph()*(view.pMax - view.pMin);
function clampView(){
  view.barW = clamp(view.barW, 1.2, 64);
  view.right = clamp(view.right, 8, bars.length - 1 + (pw()/view.barW)*0.85);
}
function autoScale(){
  if(!view.auto) return;
  const a = Math.max(0, Math.floor(iOf(0))), b = Math.min(bars.length-1, Math.ceil(view.right));
  if(a > b) return;
  let hi = -Infinity, lo = Infinity;
  for(let i=a;i<=b;i++){ if(bars[i].h>hi) hi=bars[i].h; if(bars[i].l<lo) lo=bars[i].l; }
  const r = (hi-lo) || hi*0.01;
  view.pMax = hi + r*0.09; view.pMin = lo - r*0.13;
}
function nice(raw){const e=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/e;return (f<1.5?1:f<3?2:f<7?5:10)*e}

/* ---------- drawings ---------- */
let drawings = [], selected = null, hovered = null, tool = 'cursor', magnet = false;
let drag = null, placing = null, history = [], measure = null;
let uidN = 1; const uid = () => uidN++;
const isPos = d => d && (d.type === 'long' || d.type === 'short');
function commit(){ history.push(JSON.stringify(drawings)); if(history.length > 80) history.shift(); }
let commitT = 0; const commitSoon = () => { clearTimeout(commitT); commitT = setTimeout(commit, 350); };
function undo(){
  if(history.length < 2) return;
  history.pop();
  drawings = JSON.parse(history[history.length-1]);
  select(null); placing = null; req();
}
function newDrawing(type, base){
  const d = Object.assign({id:uid(), type, locked:false}, JSON.parse(JSON.stringify(DEF[type])), base);
  drawings.push(d); return d;
}
const getP = (o,p) => p.split('.').reduce((a,k) => a == null ? a : a[k], o);
const setP = (o,p,v) => { const ks = p.split('.'); let a = o; for(let i=0;i<ks.length-1;i++) a = a[ks[i]]; a[ks[ks.length-1]] = v; };

function posStats(d){
  const long = d.type === 'long';
  const risk = Math.abs(d.entry - d.sl), reward = Math.abs(d.tp - d.entry);
  const riskAmt = d.riskMode === '$' ? d.risk : d.account*d.risk/100;
  const qty = risk > 0 ? riskAmt/risk : 0;
  const rr = risk > 0 ? reward/risk : 0;
  const last = bars.length - 1;
  let si = Math.round(I(d.t0)), ei = Math.round(I(d.t1));
  let status = 'pending', exitI = si, exitP = d.entry;
  if(si <= last && ei >= 0){
    si = Math.max(0, si);
    const end = Math.min(ei, last);
    status = 'open'; exitI = end; exitP = bars[end].c;
    for(let k=si+1;k<=end;k++){
      const b = bars[k];
      const hitS = long ? b.l <= d.sl : b.h >= d.sl;
      const hitT = long ? b.h >= d.tp : b.l <= d.tp;
      if(hitS){ status='sl'; exitI=k; exitP=d.sl; break; }
      if(hitT){ status='tp'; exitI=k; exitP=d.tp; break; }
    }
    if(status === 'open' && ei < last) status = 'closed';
  }
  const pnl = (long?1:-1)*(exitP - d.entry)*qty;
  return {long,risk,reward,qty,rr,status,exitI,exitP,pnl,si};
}
const STATUS = {open:'باز', tp:'هدف خورد', sl:'استاپ خورد', closed:'بسته شد (پایان زمان)', pending:'در انتظار'};

function pointAt(x,y){
  const i = Math.round(iOf(x)); let p = pOf(y);
  if(magnet && bars[i]){
    let best = p, bd = Infinity;
    for(const v of [bars[i].o,bars[i].h,bars[i].l,bars[i].c]){ const dd = Math.abs(yOf(v)-y); if(dd<bd){bd=dd;best=v;} }
    if(bd < 40) p = best;
  }
  return {i, t:T(i), p};
}
function posGeom(d){ return {x0:xOf(I(d.t0)), x1:xOf(I(d.t1)), yE:yOf(d.entry), yT:yOf(d.tp), yS:yOf(d.sl)}; }
const textFont = d => `${d.italic?'italic ':''}${d.bold?700:500} ${d.size}px Vazirmatn, system-ui, sans-serif`;
function textBox(d){
  ctx.font = textFont(d);
  const lines = (d.s || ' ').split('\n'), lh = d.size*1.35;
  let w = 0; for(const l of lines) w = Math.max(w, ctx.measureText(l || ' ').width);
  return {x:xOf(I(d.t)), y:yOf(d.p), w, h:lines.length*lh, lines, lh};
}
function segPts(d){
  const ax=xOf(I(d.a.t)), ay=yOf(d.a.p), bx=xOf(I(d.b.t)), by=yOf(d.b.p);
  let x1=ax,y1=ay,x2=bx,y2=by; const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy);
  if(L > 0.5){ const k = 1e4/L; if(d.extL){ x1=ax-dx*k; y1=ay-dy*k; } if(d.extR){ x2=bx+dx*k; y2=by+dy*k; } }
  return {ax,ay,bx,by,x1,y1,x2,y2};
}
function rectBox(d){
  const ax=xOf(I(d.a.t)), ay=yOf(d.a.p), bx=xOf(I(d.b.t)), by=yOf(d.b.p);
  let xl = Math.min(ax,bx), xr = Math.max(ax,bx);
  if(d.extL) xl = 0; if(d.extR) xr = pw();
  return {ax,ay,bx,by,xl,xr,yt:Math.min(ay,by),yb:Math.max(ay,by)};
}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
const near = (mx,my,x,y,r=7) => Math.abs(mx-x)<=r && Math.abs(my-y)<=r;
function hitTest(mx,my){
  for(let k=drawings.length-1;k>=0;k--){
    const d = drawings[k];
    if(isPos(d)){
      const g = posGeom(d);
      if(!d.locked) for(const [part,x,y] of [['tp',g.x0,g.yT],['sl',g.x0,g.yS],['entry',g.x0,g.yE],['end',g.x1,g.yE]])
        if(near(mx,my,x,y)) return {d,part};
      const xl=Math.min(g.x0,g.x1), xr=Math.max(g.x0,g.x1), yt=Math.min(g.yT,g.yS), yb=Math.max(g.yT,g.yS);
      if(mx>=xl && mx<=xr && my>=yt && my<=yb) return {d,part:'body'};
    } else if(d.type === 'trend'){
      const s = segPts(d);
      if(near(mx,my,s.ax,s.ay)) return {d,part:'p1'};
      if(near(mx,my,s.bx,s.by)) return {d,part:'p2'};
      if(distSeg(mx,my,s.x1,s.y1,s.x2,s.y2) <= 5) return {d,part:'body'};
    } else if(d.type === 'rect'){
      const r = rectBox(d);
      if(near(mx,my,r.ax,r.ay)) return {d,part:'p1'};
      if(near(mx,my,r.bx,r.by)) return {d,part:'p2'};
      if(near(mx,my,r.ax,r.by)) return {d,part:'p3'};
      if(near(mx,my,r.bx,r.ay)) return {d,part:'p4'};
      if(mx>=r.xl-4 && mx<=r.xr+4 && my>=r.yt-4 && my<=r.yb+4) return {d,part:'body'};
    } else if(d.type === 'text'){
      const b = textBox(d);
      if(mx>=b.x-6 && mx<=b.x+b.w+6 && my>=b.y-5 && my<=b.y+b.h+5) return {d,part:'body'};
    } else if(d.type === 'hline'){
      if(Math.abs(my - yOf(d.p)) <= 5) return {d,part:'body'};
    }
  }
  return null;
}
function applyEdit(dr,x,y){
  const d = dr.d, o = dr.orig;
  const di = Math.round((x - dr.x0)/view.barW), dp = pOf(y) - pOf(dr.y0), pt = pointAt(x,y);
  if(Math.abs(x-dr.x0)+Math.abs(y-dr.y0) > 2) dr.moved = true;
  if(d.type === 'hline'){ d.p = magnet ? pt.p : o.p + dp; return; }
  if(d.type === 'text'){ d.t = o.t + di*tfSec; d.p = o.p + dp; return; }
  if(d.type === 'trend' || d.type === 'rect'){
    switch(dr.part){
      case 'p1': d.a = {t:pt.t,p:pt.p}; break;
      case 'p2': d.b = {t:pt.t,p:pt.p}; break;
      case 'p3': d.a = {t:pt.t,p:d.a.p}; d.b = {t:d.b.t,p:pt.p}; break;
      case 'p4': d.b = {t:pt.t,p:d.b.p}; d.a = {t:d.a.t,p:pt.p}; break;
      default: d.a = {t:o.a.t+di*tfSec, p:o.a.p+dp}; d.b = {t:o.b.t+di*tfSec, p:o.b.p+dp};
    }
    return;
  }
  const long = d.type === 'long', eps = (view.pMax - view.pMin)*0.002;
  switch(dr.part){
    case 'body': d.t0=o.t0+di*tfSec; d.t1=o.t1+di*tfSec; d.entry=o.entry+dp; d.tp=o.tp+dp; d.sl=o.sl+dp; break;
    case 'tp': d.tp = long ? Math.max(pt.p, d.entry+eps) : Math.min(pt.p, d.entry-eps); break;
    case 'sl': d.sl = long ? Math.min(pt.p, d.entry-eps) : Math.max(pt.p, d.entry+eps); break;
    case 'entry': {
      d.t0 = Math.min(pt.t, d.t1 - tfSec);
      const lo = Math.min(d.tp,d.sl)+eps, hi = Math.max(d.tp,d.sl)-eps;
      d.entry = clamp(pt.p, lo, hi); break;
    }
    case 'end': d.t1 = Math.max(pt.t, d.t0 + tfSec); break;
  }
}

/* ---------- formatting ---------- */
const fP = v => v.toFixed(2);
const money = v => (v<0?'-':'') + '$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fQty = v => v >= 100 ? v.toFixed(1) : v.toFixed(3);
const fVol = v => v>=1e6 ? (v/1e6).toFixed(2)+'M' : v>=1e3 ? (v/1e3).toFixed(1)+'K' : v.toFixed(0);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const p2 = n => String(n).padStart(2,'0');
function fmtDur(s){ const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d) return d+'d'+(h?' '+h+'h':''); if(h) return h+'h'+(m?' '+m+'m':''); return m+'m'; }
function tLabel(t){
  const d = new Date(t*1000);
  if(tfSec >= 86400) return d.getDate() === 1 ? MON[d.getMonth()] : String(d.getDate());
  if(d.getHours()===0 && d.getMinutes()===0) return d.getDate()+' '+MON[d.getMonth()];
  return p2(d.getHours())+':'+p2(d.getMinutes());
}
function tFull(t){
  const d = new Date(t*1000);
  const s = DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+" '"+String(d.getFullYear()).slice(2);
  return tfSec >= 86400 ? s : s+'  '+p2(d.getHours())+':'+p2(d.getMinutes());
}
const toLocal = t => { const d = new Date(t*1000); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fromLocal = s => { const t = new Date(s).getTime()/1000; return isFinite(t) ? bars[0].t + Math.round((t-bars[0].t)/tfSec)*tfSec : null; };

/* ---------- render ---------- */
let raf = 0, mouse = {x:-1,y:-1,in:false};
const req = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function tag(cx,y,lines,bg,where,fg){
  ctx.font = F_FA; ctx.direction = 'rtl';
  const lh = 17; let w = 0;
  for(const l of lines) w = Math.max(w, ctx.measureText(l).width);
  w += 20; const h = lines.length*lh + 8;
  const top = where==='above' ? y-h-6 : where==='below' ? y+6 : y-h/2;
  rr(cx-w/2, top, w, h, 4); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg || inkOn(bg.startsWith('#') ? bg : '#262b35'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l,k) => ctx.fillText(l, cx, top+4+lh/2+k*lh+0.5));
  ctx.direction = 'ltr';
}
function handle(x,y,round){
  ctx.setLineDash([]);
  ctx.fillStyle = C.bg; ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if(round) ctx.arc(x,y,4.5,0,Math.PI*2); else ctx.rect(Math.round(x)-4.5,Math.round(y)-4.5,9,9);
  ctx.fill(); ctx.stroke();
}
function axisTag(y,text,bg){
  const PW = pw();
  ctx.fillStyle = bg; rr(PW+1, y-10, AR-3, 20, 3); ctx.fill();
  ctx.fillStyle = bg.startsWith('#') ? inkOn(bg) : C.on; ctx.font = F_AX; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, PW+9, y+0.5);
}
function timeBand(x0,x1){ ctx.fillStyle = C.sel; ctx.fillRect(Math.min(x0,x1), ph()+1, Math.abs(x1-x0), AB-1); }
function lineStyle(style,w){
  ctx.lineWidth = w;

function timeTicks(){
  const cand=[1,2,3,4,6,8,12,16,24,32,48,64,96,128,192,256,384];
  const k = cand.find(c => c*view.barW >= 84) || 384;
  const a = Math.floor(iOf(0)), b = Math.ceil(view.right), out = [];
  for(let i=Math.ceil(a/k)*k;i<=b;i+=k) out.push(i);
  return out;
}

function render(){
  if(!W) return;
  autoScale(); calcEma();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const PW = pw(), PH = ph(), last = bars.length-1;
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

  const step = nice((view.pMax-view.pMin)/(PH/58)), pTicks = [];
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for(let p=Math.ceil(view.pMin/step)*step; p<=view.pMax; p+=step){ const y=Math.round(yOf(p))+0.5; ctx.moveTo(0,y); ctx.lineTo(PW,y); pTicks.push([p,y]); }
  const tTicks = timeTicks();
  for(const i of tTicks){ const x=Math.round(xOf(i))+0.5; ctx.moveTo(x,0); ctx.lineTo(x,PH); }
  ctx.stroke();

  ctx.save(); ctx.beginPath(); ctx.rect(0,0,PW,PH); ctx.clip();
  const a = Math.max(0, Math.floor(iOf(0))-1), b = Math.min(last, Math.ceil(view.right));
  let vmax = 0; for(let i=a;i<=b;i++) vmax = Math.max(vmax, bars[i].v);
  const vh = PH*0.16, bw = Math.max(1, Math.round(view.barW*0.72)), half = Math.floor(bw/2);
  for(let i=a;i<=b;i++){
    const B = bars[i], x = Math.round(xOf(i)), h = B.v/vmax*vh;
    ctx.fillStyle = B.c>=B.o ? C.upVol : C.downVol;
    ctx.fillRect(x-half, PH-h, bw, h);
  }

    const B = bars[i], x = Math.round(xOf(i)), upc = B.c >= B.o;
    ctx.fillStyle = upc ? C.up : C.down;
    const yh = yOf(B.h), yl = yOf(B.l);
    ctx.fillRect(x, Math.round(yh), 1, Math.max(1, Math.round(yl-yh)));
    const yo = yOf(B.o), yc = yOf(B.c);

    const ci = Math.round(iOf(mouse.x)), cx = Math.round(xOf(ci))+0.5, cy = Math.round(mouse.y)+0.5;
    ctx.setLineDash([4,4]); ctx.strokeStyle = C.cross; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,PH); ctx.moveTo(0,cy); ctx.lineTo(PW,cy); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = C.border; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(PW+0.5,0); ctx.lineTo(PW+0.5,PH); ctx.moveTo(0,PH+0.5); ctx.lineTo(W,PH+0.5); ctx.stroke();

  }
  updateLegend(); syncAll();
}

  else { tipEl.style.left = (r.right + 10)+'px'; tipEl.style.top = (r.top + r.height/2 - t.height/2)+'px'; }
}
function attachTip(b, text, side){

}

  editing = d;
  const b = textBox(d);
  editor = document.createElement('textarea');
  editor.className = 'txt-edit'; editor.dir = 'auto'; editor.rows = 1; editor.value = d.s || '';
  editor.placeholder = 'متن رو بنویس…';
  editor.style.font = textFont(d); editor.style.color = colorOf(d.color);
  editor.style.left = (b.x - 7) + 'px'; editor.style.top = (b.y - 4) + 'px';
  wrap.appendChild(editor);
  const fit = () => { editor.style.height = 'auto'; editor.style.height = editor.scrollHeight + 'px'; };
  editor.addEventListener('input', fit); fit();
  editor.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); closeEditor(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); if(isNew) editor.value = ''; closeEditor(!isNew || true); }
    e.stopPropagation();
  });
  editor.addEventListener('blur', () => closeEditor(true));
  setTimeout(() => { if(editor){ editor.focus(); editor.select(); } }, 0);
  req();
}
function closeEditor(save){
  if(!editing || !editor) return;
  const d = editing, el = editor; editing = null; editor = null;
  if(save) d.s = el.value.replace(/\s+$/,'');
  el.remove();
  if(!d.s){ drawings = drawings.filter(x => x !== d); if(selected === d) selected = null; }
  commit(); req();
}

/* ---------- actions ---------- */
const HINTS = {
  cursor:'کلیک روی ترسیم: نوار تنظیمات · دابل‌کلیک: تنظیمات کامل · Shift+کشیدن: خط‌کش · چرخ ماوس: زوم',
  cross:'کراس‌هیر فعاله. برای جابجایی چارت بکش.',
  trend:'نقطه اول رو کلیک کن، بعد نقطه دوم (یا بکش). Esc لغو.',
  hline:'روی هر قیمتی کلیک کن تا خط افقی بیفته.',
  rect:'از یه گوشه تا گوشه مقابل بکش (یا دو بار کلیک کن).',
  text:'هرجا کلیک کنی متن اونجا میفته. Enter ثبت، Shift+Enter خط جدید.',
  long:'روی قیمت ورود کلیک کن. بعد دستگیره‌های حد سود، حد ضرر و انتهای باکس رو بکش.',
  short:'روی قیمت ورود کلیک کن. بعد دستگیره‌های حد سود، حد ضرر و انتهای باکس رو بکش.',
  measure:'بکش یا کلیک، حرکت، کلیک. فاصله قیمت، درصد، تعداد کندل، زمان و حجم رو نشون میده.'
};
function setTool(t){
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  $('#hint').textContent = HINTS[t];
  cv.style.cursor = t==='cursor' ? 'default' : t==='text' ? 'text' : 'crosshair';
}
function select(d){ selected = d; req(); }
function removeSelected(){
  if(!selected) return;
  drawings = drawings.filter(x => x !== selected);
  select(null); commit();
}
function cloneSel(){
  const d = selected; if(!d) return;
  const c = JSON.parse(JSON.stringify(d)); c.id = uid(); c.locked = false;
  const dt = Math.max(3, Math.round(30/view.barW))*tfSec;
  if(c.type === 'hline') c.p += (view.pMax - view.pMin)*0.03;
  if(c.t != null) c.t += dt; if(c.t0 != null){ c.t0 += dt; c.t1 += dt; }
  if(c.a){ c.a.t += dt; c.b.t += dt; }
  drawings.push(c); select(c); commit();
}
function flipPos(d){
  if(!isPos(d)) return;
  d.type = d.type === 'long' ? 'short' : 'long';
  d.tp = 2*d.entry - d.tp; d.sl = 2*d.entry - d.sl;
  if(settingsFor === d) buildPanel();
  commit(); req();
}
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#magnet').onclick = () => { magnet = !magnet; $('#magnet').setAttribute('aria-pressed', String(magnet)); };
$('#undo').onclick = undo;
$('#clearAll').onclick = () => { if(!drawings.length) return; drawings = []; select(null); commit(); };

function setTheme(t){
  theme = t; C = THEMES[t]; document.documentElement.dataset.theme = t;
  try { localStorage.setItem('zo-chart-theme', t); } catch(e){}
  ftbFor = undefined; req();
}
$('#themeBtn').onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');
$('#emaBtn').onclick = () => { showEma = !showEma; $('#emaBtn').setAttribute('aria-pressed', String(showEma)); req(); };

/* ---------- pointer ---------- */
function pos(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function createPosition(type, pt){
  const span = (view.pMax - view.pMin)*0.06, long = type === 'long';
  const n = Math.max(10, Math.round(170/view.barW));
  return newDrawing(type, {t0:pt.t, t1:pt.t+n*tfSec, entry:pt.p, tp: long ? pt.p+span*2 : pt.p-span*2, sl: long ? pt.p-span : pt.p+span});
}
cv.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  const {x,y} = pos(e);
  const PW = pw(), PH = ph();
  if(x > PW && y < PH){ cv.setPointerCapture(e.pointerId); drag = {k:'pscale', y0:y, a:view.pMin, b:view.pMax}; view.auto = false; syncAuto(); return; }
  if(y > PH){ cv.setPointerCapture(e.pointerId); drag = {k:'tscale', x0:x, bw:view.barW}; return; }
  if(measure){
    if(measure.phase === 'follow'){ measure.phase = 'done'; setTool('cursor'); req(); return; }
    if(measure.phase === 'done'){ measure = null; req(); if(tool !== 'measure' && !e.shiftKey) return; }
  }
  if(placing){ placing = null; commit(); setTool('cursor'); req(); return; }
  const pt = pointAt(x,y);
  if(tool === 'measure' || (e.shiftKey && (tool === 'cursor' || tool === 'cross'))){
    cv.setPointerCapture(e.pointerId);
    measure = {a:{i:pt.i,p:pt.p}, b:{i:pt.i,p:pt.p}, phase:'drag'};
    drag = {k:'measure', x0:x, y0:y, moved:false}; select(null); return;
  }
  if(tool === 'text'){
    e.preventDefault();
    const d = newDrawing('text', {t:pt.t, p:pt.p, s:''});
    select(d); setTool('cursor'); openEditor(d, true); return;
  }
  cv.setPointerCapture(e.pointerId);
  if(tool === 'trend' || tool === 'rect'){
    const d = newDrawing(tool, {a:{t:pt.t,p:pt.p}, b:{t:pt.t,p:pt.p}});
    select(d); placing = d; drag = {k:'place', d, x0:x, y0:y, moved:false}; return;
  }
  if(tool === 'hline'){ const d = newDrawing('hline', {p:pt.p}); select(d); commit(); setTool('cursor'); return; }
  if(tool === 'long' || tool === 'short'){ const d = createPosition(tool, pt); select(d); commit(); setTool('cursor'); return; }
  const h = hitTest(x,y);
  if(h){
    select(h.d);
    if(!h.d.locked){ drag = {k:'edit', d:h.d, part:h.part, x0:x, y0:y, orig:JSON.parse(JSON.stringify(h.d)), moved:false}; return; }
  } else select(null);
  drag = {k:'pan', x0:x, y0:y, r:view.right, a:view.pMin, b:view.pMax};
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  const {x,y} = pos(e);
  mouse = {x, y, in: x>=0 && y>=0 && x<pw() && y<ph()};
  if(drag){
    switch(drag.k){
      case 'pscale': { const f = Math.exp((y-drag.y0)*0.006), mid=(drag.a+drag.b)/2, hf=(drag.b-drag.a)/2*f; view.pMin=mid-hf; view.pMax=mid+hf; break; }
      case 'tscale': view.barW = clamp(drag.bw*Math.exp((x-drag.x0)*0.008), 1.2, 64); clampView(); break;
      case 'pan':
        view.right = drag.r - (x-drag.x0)/view.barW;
        if(!view.auto){ const dp = (y-drag.y0)/ph()*(drag.b-drag.a); view.pMin = drag.a+dp; view.pMax = drag.b+dp; }
        clampView(); break;
      case 'place': { const pt = pointAt(x,y); drag.d.b = {t:pt.t,p:pt.p}; if(Math.hypot(x-drag.x0,y-drag.y0) > 6) drag.moved = true; break; }
      case 'measure': { const pt = pointAt(x,y); measure.b = {i:pt.i,p:pt.p}; if(Math.hypot(x-drag.x0,y-drag.y0) > 6) drag.moved = true; break; }
      case 'edit': applyEdit(drag,x,y); break;
    }
  } else {
    if(placing){ const pt = pointAt(x,y); placing.b = {t:pt.t,p:pt.p}; }
    if(measure && measure.phase === 'follow'){ const pt = pointAt(x,y); measure.b = {i:pt.i,p:pt.p}; }
    let c = tool==='cursor' ? 'default' : tool==='text' ? 'text' : 'crosshair', h = null;
    if(x > pw() && y < ph()) c = 'ns-resize';
    else if(y > ph()) c = 'ew-resize';
    else if((tool==='cursor'||tool==='cross') && !placing){
      h = hitTest(x,y);
      if(h){
        const p = h.part;
        c = h.d.locked ? 'pointer' : p==='body'||p==='entry' ? 'move' : p==='end' ? 'ew-resize' : (p==='p1'||p==='p2') && h.d.type==='rect' ? 'nwse-resize' : (p==='p3'||p==='p4') ? 'nesw-resize' : p==='p1'||p==='p2' ? 'pointer' : 'ns-resize';
      }
    }
    hovered = h ? h.d : null;
    cv.style.cursor = c;
  }
  req();
});
cv.addEventListener('pointerup', () => {
  if(!drag) return;
  if(drag.k === 'place' && drag.moved){ placing = null; commit(); setTool('cursor'); }
  else if(drag.k === 'measure'){ if(drag.moved){ measure.phase = 'done'; setTool('cursor'); } else measure.phase = 'follow'; }
  else if(drag.k === 'edit' && drag.moved) commit();
  if(drag.k === 'pan') cv.style.cursor = tool==='cursor' ? 'default' : 'crosshair';
  drag = null; req();
});
cv.addEventListener('pointerleave', () => { mouse.in = false; hovered = null; req(); });
cv.addEventListener('dblclick', e => {
  const {x,y} = pos(e);
  if(x > pw() && y < ph()){ view.auto = true; syncAuto(); req(); return; }
  const h = hitTest(x,y);
  if(!h) return;
  if(h.d.type === 'text' && !h.d.locked) openEditor(h.d, false);
  else { select(h.d); openSettings(h.d); }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if(editor) closeEditor(true);
  const {x} = pos(e);
  if(x > pw()){
    const f = Math.exp(e.deltaY*0.0015), mid=(view.pMin+view.pMax)/2, hf=(view.pMax-view.pMin)/2*f;
    view.auto = false; syncAuto(); view.pMin = mid-hf; view.pMax = mid+hf; req(); return;
  }
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ view.right += e.deltaX/view.barW; clampView(); req(); return; }
  const i = iOf(x);
  view.barW = clamp(view.barW*Math.exp(-e.deltaY*0.0018), 1.2, 64);
  view.right = i + (pw()-x)/view.barW; clampView(); req();
}, {passive:false});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input,textarea,select');
  if(typing) return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && k === 'z'){ e.preventDefault(); undo(); return; }
  if((e.ctrlKey||e.metaKey) && k === 'd'){ e.preventDefault(); cloneSel(); return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){ if(selected && !selected.locked) removeSelected(); return; }
  if(e.key === 'Escape'){
    if(placing){ drawings = drawings.filter(d => d !== placing); placing = null; drag = null; }
    measure = null; closePop(); select(null); setTool('cursor'); return;
  }
  if(e.key === 'Enter' && selected){ if(selected.type === 'text') openEditor(selected, false); else openSettings(selected); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const map = {v:'cursor', c:'cross', t:'trend', h:'hline', r:'rect', x:'text', l:'long', s:'short', u:'measure'};
  if(map[k]) setTool(map[k]);
  if(k === 'm') $('#magnet').click();
});

/* ---------- footer ---------- */
function syncAuto(){ $('#autoBtn').setAttribute('aria-pressed', String(view.auto)); }
$('#autoBtn').onclick = () => { view.auto = !view.auto; syncAuto(); req(); };
$('#zIn').onclick = () => { view.barW *= 1.25; clampView(); req(); };
$('#zOut').onclick = () => { view.barW /= 1.25; clampView(); req(); };
$('#goLive').onclick = () => { view.right = bars.length - 1 + 8; view.auto = true; syncAuto(); req(); };
function tick(){ const d = new Date(); $('#clock').textContent = p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }

/* ---------- timeframes ---------- */
const tfNav = $('#tfs');
Object.keys(TFS).forEach(k => {
  const b = document.createElement('button'); b.textContent = k; b.setAttribute('aria-pressed', String(k===tf));
  b.onclick = () => setTf(k); tfNav.appendChild(b);
});
function setTf(k){
  if(editor) closeEditor(true);
  tf = k; tfSec = TFS[k]; gen(700); measure = null;
  view.right = bars.length - 1 + 8; view.auto = true; syncAuto();
  tfNav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent===k)));
  prevPx = bars[bars.length-1].c; updateHeader(); req();
}

/* ---------- live ticks ---------- */
let tickN = 0;
setInterval(() => {
  const last = bars.length-1, B = bars[last];
  const sig = 0.0036*Math.sqrt(tfSec/900)/4.5;
  B.c = B.c*Math.exp(sig*gauss(Math.random));
  B.h = Math.max(B.h, B.c); B.l = Math.min(B.l, B.c); B.v += Math.random()*90;
  if(++tickN >= 22){
    tickN = 0;
    bars.push({t:B.t+tfSec, o:B.c, h:B.c, l:B.c, c:B.c, v:0});
    if(view.right >= last - 1) view.right += 1;
  }
  updateHeader();
  if(!editor) req();
}, 650);

/* ---------- boot ---------- */
function resize(){
  const r = wrap.getBoundingClientRect(); DPR = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  clampView(); render(); placeFtb();
}
gen(700);
view.right = bars.length - 1 + 8;
(function seedDemo(){
  const last = bars.length-1, i0 = last - 72;
  let atr = 0; for(let i=i0-14;i<i0;i++) atr += bars[i].h - bars[i].l; atr /= 14;
  const e = bars[i0].c;
  newDrawing('long', {t0:bars[i0].t, t1:bars[i0].t+44*tfSec, entry:e, tp:e+atr*3.2, sl:e-atr*1.6});
})();
commit();
setTool('cursor'); updateHeader(); tick(); setInterval(tick, 1000);
new ResizeObserver(resize).observe(wrap);
if(document.fonts) document.fonts.ready.then(req);
</script>
</body>
